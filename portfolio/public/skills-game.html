<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/profile/favicon.svg"><title>José Yrikes | Skills Quest</title><style>body{margin:0;background:#07111f;color:#e5eefc;font-family:Inter,Arial,sans-serif}main{max-width:1100px;margin:auto;padding:40px 20px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.back{color:#7dd3fc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px}.card{background:#0f1b2d;border:1px solid #24344d;border-radius:24px;padding:24px}.board{display:grid;grid-template-columns:repeat(12,1fr);aspect-ratio:1;background:#050b14;border-radius:18px;overflow:hidden}.cell{border:1px solid #0c1727}.snake{background:#38bdf8}.food{background:#a78bfa}.skills{display:grid;gap:12px;max-height:620px;overflow:auto}.skill{padding:16px;border:1px solid #263850;border-radius:16px;background:#0a1525;opacity:.42}.skill.on{opacity:1;border-color:#38bdf8}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button{background:#2563eb;color:white;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div><a class="back" href="/profile/">← Back to portfolio</a><h1>Skills Quest</h1><p>Collect nodes to unlock the technologies and engineering areas behind my work.</p></div><div>🎮</div></div><div class="actions"><button id="start">Start / Restart</button><button id="all">Unlock all skills</button></div><div class="grid"><section class="card"><div id="board" class="board"></div><p>Use the arrow keys. Each collected node unlocks one skill.</p></section><section class="card"><h2>Unlocked skills <span id="count">0</span>/16</h2><div id="skills" class="skills"></div></section></div></main><script>const names=['Python','FastAPI & Flask','Java & Spring Boot','React & TypeScript','PostgreSQL & TimescaleDB','Docker & CI/CD','Computer Vision','Applied Machine Learning','Quantum Computing & Qiskit','Industrial Software','IoT & Device Integration','Observability & Zabbix','Software Architecture','Testing & Automation','Open Source','Technical Documentation'];const desc=['Backend, automation and scientific computing.','API design, data services and integrations.','Enterprise backend and service architecture.','Responsive interfaces and developer-facing applications.','Relational and time-series data engineering.','Reproducible delivery pipelines and containers.','Dataset analysis, detection models and evaluation.','Experimental pipelines, metrics and model comparison.','Quantum encodings, circuits and multi-engine tooling.','Production-oriented systems for industrial environments.','Protocols, acquisition systems and edge integration.','Monitoring, alerting and infrastructure visibility.','Modular design, contracts and maintainability.','Unit, integration and regression testing.','Public packages, documentation and community contribution.','Articles, reports, notebooks and reproducible evidence.'];const board=document.getElementById('board'),skills=document.getElementById('skills'),count=document.getElementById('count');let snake,dir,food,timer,unlocked;function drawSkills(){skills.innerHTML=names.map((n,i)=>`<div class="skill ${i<unlocked?'on':''}"><strong>${n}</strong><div>${desc[i]}</div></div>`).join('');count.textContent=unlocked}function placeFood(){food=Math.floor(Math.random()*144)}function draw(){board.innerHTML='';for(let i=0;i<144;i++){const c=document.createElement('div');c.className='cell'+(snake.includes(i)?' snake':'')+(i===food?' food':'');board.appendChild(c)}}function start(){clearInterval(timer);snake=[65,64,63];dir=1;unlocked=0;placeFood();drawSkills();draw();timer=setInterval(step,150)}function step(){const h=snake[0],x=h%12,y=Math.floor(h/12);let nx=x,ny=y;if(dir===1)nx++;if(dir===-1)nx--;if(dir===12)ny++;if(dir===-12)ny--;if(nx<0||nx>11||ny<0||ny>11)return start();const nh=ny*12+nx;if(snake.includes(nh))return start();snake.unshift(nh);if(nh===food){unlocked=Math.min(16,unlocked+1);drawSkills();placeFood()}else snake.pop();draw()}addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&dir!==-1)dir=1;if(e.key==='ArrowLeft'&&dir!==1)dir=-1;if(e.key==='ArrowDown'&&dir!==-12)dir=12;if(e.key==='ArrowUp'&&dir!==12)dir=-12});document.getElementById('start').onclick=start;document.getElementById('all').onclick=()=>{unlocked=16;drawSkills()};drawSkills();start();</script></body></html>
