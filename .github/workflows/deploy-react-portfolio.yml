name: Deploy React portfolio to GitHub Pages

# Manual redeploy trigger: 2026-07-16
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify Node.js 22 runtime
        run: |
          node --version
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major !== 22) { console.error('Expected Node.js 22, received ' + process.version); process.exit(1); }"

      - name: Install dependencies
        working-directory: portfolio
        run: npm install

      - name: Build
        working-directory: portfolio
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: portfolio/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
